name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -p test_desktop.py -v
      - run: python -m PyInstaller --noconfirm desktop.spec
      - name: Package
        shell: pwsh
        run: |
          Copy-Item docs/桌面版使用说明.md dist/InvoiceBox/使用说明.md
          Compress-Archive -Path dist/InvoiceBox -DestinationPath InvoiceBox-windows-x64.zip
          $hash = (Get-FileHash InvoiceBox-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceBox-windows-x64.zip" | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceBox-windows-x64
          path: |
            InvoiceBox-windows-x64.zip
            SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" InvoiceBox-windows-x64.zip SHA256SUMS.txt --title "InvoiceBox ${{ github.ref_name }}" --notes-file docs/桌面版使用说明.md
